<form [formGroup]="form" class="flex items-center gap-3">
  <p-iconfield class="w-full">
    <p-inputicon class="pi pi-search" />

    <input
      pInputText
      placeholder="Buscar..."
      pSize="small"
      class="min-w-100 w-50"
      formControlName="globalFilter"
    />
  </p-iconfield>
  <!-- TODO: implement extra filters -->
  <p-button
    icon="pi pi-filter"
    class="hidden md:block"
    size="small"
    disabled
    severity="secondary"
    variant="outlined"
  />
</form>
