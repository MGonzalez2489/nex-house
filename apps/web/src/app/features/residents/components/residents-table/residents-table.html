<!-- TODO: apply residentFilters -->
<p-panel header="Residentes" class="overflow-x-auto">
  <ng-template #icons>
    <app-resident-filters (filter)="filter($event)" />
  </ng-template>
  <p-table
    [value]="items()"
    [paginator]="true"
    [rows]="pagination()?.limit || 10"
    showFirstLastIcon="false"
    #dt
    [paginator]="pagination()"
    [totalRecords]="pagination()?.total || 0"
    [loading]="isLoading()"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
    paginatorStyleClass="mt-5"
    [lazy]="true"
    [lazyLoadOnInit]="true"
    (onLazyLoad)="search($event)"
  >
    <ng-template #header>
      <tr>
        <th style="width: 10%"></th>
        <th style="width: 30%">Nombre</th>
        <th style="width: 25%">Rol</th>
        <th style="width: 25%">Estatus</th>
        <th style="width: 10%"></th>
      </tr>
    </ng-template>
    <ng-template #body let-user>
      <tr>
        <td>
          <app-avatar-component [text]="user.fullName" />
        </td>
        <td>
          <p class="font-semibold capitalize">{{ user.fullName ?? "--" }}</p>
          <p class="text-sm text-slate-400">{{ user.email }}</p>
        </td>

        <td>
          {{ user.role.displayName }}
        </td>
        <td>
          <app-resident-status-component [status]="user.status" />
        </td>
        <td>
          <p-button
            icon="pi pi-search"
            severity="secondary"
            text
            size="small"
            (click)="view.emit(user.publicId)"
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-panel>
