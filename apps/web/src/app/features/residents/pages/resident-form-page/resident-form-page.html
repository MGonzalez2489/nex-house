<div class="max-w-2xl mx-auto pb-24 lg:pb-6">
  <!-- Header -->
  <div class="flex items-center gap-3 mb-6">
    <p-button
      class="hidden"
      icon="pi pi-arrow-left"
      severity="secondary"
      variant="outlined"
      size="small"
    />

    <div>
      <h1 class="text-xl sm:text-2xl font-display font-semibold text-slate-900 dark:text-white">
        {{ id() ? 'Actualizar' : 'Nuevo' }} residente
      </h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">
        Registra la información básica y las calles que lo componen.
      </p>
    </div>
  </div>
  <form class="space-y-5" [formGroup]="form" (submit)="submit()">
    <!-- Información general -->
    <p-panel>
      <ng-template #header>
        <h2 class="text-sm font-semibold">Información general</h2>
      </ng-template>

      <div class="grid grid-cols-1 md:grid-cols-3 md:gap-x-3">
        <!-- Nombre -->
        <div class="form-control col-span-2">
          <label class="form-label" for="email">Correo Electrónico</label>
          <input
            pInputText
            id="email"
            type="email"
            formControlName="email"
            placeholder="Jhon@example.com"
            fluid
            [invalid]="form.controls.email.invalid && form.controls.email.touched"
            [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched"
            [attr.aria-describedby]="
              form.controls.email.touched && form.controls.email.errors ? 'email-error' : null
            "
          />
          <app-form-validation-error
            id="email-errors"
            [touched]="form.controls.email.touched"
            [errors]="form.controls.email.errors"
            label="Email"
          />
        </div>
        <!-- User Role -->
        <div class="form-control">
          <label class="form-label" for="userRole">Rol</label>
          <p-select
            [options]="catStore.UserRoles()"
            formControlName="userRoleId"
            optionLabel="displayName"
            optionValue="publicId"
            placeholder="Rol"
            fluid
          />
        </div>
      </div>
    </p-panel>
    <!-- Unit Info -->
    <p-panel showHeader="false" class="pt-5">
      <app-unit-form-component
        formControlName="unit"
        [canPickExisting]="true"
        [searchUnits]="unitStore.entities()"
        [streets]="contextStore.streets()"
        [unitTypes]="catStore.UnitTypes()"
        [unitRoles]="catStore.UserUnitRoles()"
      />
    </p-panel>
    <!-- Acciones -->
    <div class="hidden lg:flex items-center justify-end gap-3">
      <p-button label="Cancelar" severity="secondary" variant="outlined" (click)="cancel()" />
      <p-button label="Guardar" type="submit" />
    </div>
    <div
      class="lg:hidden fixed bottom-0 left-0 right-0 z-30 border-t border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95 backdrop-blur px-4 py-3 flex items-center gap-3"
    >
      <p-button
        label="Cancelar"
        severity="secondary"
        variant="outlined"
        fluid
        (click)="cancel()"
        class="flex-1"
      />

      <p-button label="Guardar" class="flex-1" fluid type="submit" />
    </div>
  </form>
</div>
<pre>{{ form.value | json }}</pre>
