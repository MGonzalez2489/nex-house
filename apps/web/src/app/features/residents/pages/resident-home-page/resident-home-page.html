<div class="space-y-6">
  <!-- Header -->
  <div
    class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4"
  >
    <div>
      <div class="flex items-center gap-2 flex-wrap">
        <h1
          class="text-xl sm:text-2xl font-display font-semibold text-slate-900 dark:text-white"
        >
          Residentes
        </h1>
        <span
          class="text-xs font-medium text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 rounded-full px-2 py-0.5"
        >
          stats
        </span>
      </div>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
        Busca, filtra y administra los fraccionamientos de la plataforma.
      </p>
    </div>

    <div class="flex items-center gap-3 hidden">
      <p-button icon="pi pi-filter" text class="hidden md:block" />
      <p-button
        icon="pi pi-plus"
        label="Nuevo"
        (click)="create()"
        class="hidden md:block"
      />
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
    <p-panel
      header="Lista de registros"
      class="col-span-2 overflow-x-auto"
      [pt]="{ content: 'p-0' }"
    >
      <ng-template #icons>
        <div class="flex items-center gap-3">
          <app-resident-filters (filter)="onSearch($event)" />
          <p-button
            icon="pi pi-plus"
            label="Nuevo"
            size="small"
            (click)="create()"
            class="hidden md:block"
          />
        </div>
      </ng-template>
      <app-residents-table
        [isLoading]="store.loading()"
        [items]="store.entities()"
        [pagination]="store.pagination()"
        (paginate)="onSearch($event)"
      />
    </p-panel>
    <app-resident-stats [stats]="store.stats()" />
    <!-- <p-panel class="col-span-1">asdasdasd</p-panel> -->
  </div>
</div>
