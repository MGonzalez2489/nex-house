<div class="space-y-6">
  <!-- Header -->
  <div
    class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4"
  >
    <div>
      <div class="flex items-center gap-2 flex-wrap">
        <h1
          class="text-xl sm:text-2xl font-display font-semibold text-slate-900 dark:text-white"
        >
          Residentes
        </h1>
      </div>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
        Busca, filtra y administra los redientes de la plataforma.
      </p>
    </div>

    <div class="flex items-center gap-3">
      <p-button
        icon="pi pi-plus"
        label="Nuevo"
        (click)="create()"
        class="hidden md:block"
      />
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
    <app-residents-table
      class="col-span-2"
      [isLoading]="store.loading()"
      [items]="store.entities()"
      [pagination]="store.pagination()"
      (paginate)="onSearch($event)"
      (view)="view($event)"
    />

    <app-resident-stats [stats]="store.stats()" />
  </div>
</div>
