<p-panel header="Información Personal">
  <ng-template #icons>
    @if (mode() !== "form") {
      <p-button
        icon="pi pi-pencil"
        label="Editar"
        text
        severity="secondary"
        size="small"
        (click)="changeMode()"
      />
    }
  </ng-template>

  <app-profile-form-component
    [profile]="profile()"
    [disabledForm]="mode() === 'info'"
    (doSubmit)="doSubmit($event)"
  >
    @if (mode() === "form") {
      <app-form-options (doCancel)="cancel()" />
    }
  </app-profile-form-component>
</p-panel>
