<div>
  <div class="text-center mb-8">
    <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Encuentra tu cuenta</h1>
    <p class="text-slate-500 text-sm mt-2">
      Ingresa el correo asociado a tu cuenta y te enviaremos un código de verificación.
    </p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <app-auth-email-field [control]="form.controls.email" />

    <div class="pt-5">
      <app-form-options
        [submitFullWidth]="true"
        [showCancel]="false"
        submitLabel="Enviar"
        [isLoading]="store.loading()"
        [callState]="store.callState()"
      />
    </div>

    <div class="pt-6 border-t border-slate-50 text-center">
      <a
        [routerLink]="['/auth', PASS_VALIDATE_CODE]"
        class="text-xs font-medium text-blue-600 hover:text-blue-700 transition-colors"
      >
        Ya tengo código
      </a>
    </div>
  </form>
</div>
