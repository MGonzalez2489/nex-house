<div>
  <div class="text-center mb-8">
    <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Valida tu codigo</h2>
    <p class="text-slate-500 text-sm mt-2">
      Lorem ipsum dolor sit amet, consectetur adipiscing elit...
    </p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-control">
      <label for="code" class="form-label">Codigo de validación</label>
      <input
        pInputText
        id="code"
        type="text"
        formControlName="code"
        placeholder="ABC-123"
        fluid
        [invalid]="form.controls.code.invalid && form.controls.code.touched"
        [attr.aria-invalid]="form.controls.code.invalid && form.controls.code.touched"
        [attr.aria-describedby]="
          form.controls.code.touched && form.controls.code.errors ? 'code-error' : null
        "
      />

      <app-form-validation-error
        id="code-errors"
        [touched]="form.controls.code.touched"
        [errors]="form.controls.code.errors"
        label="Codigo"
      />
    </div>

    <div class="pt-5">
      <app-form-options [submitFullWidth]="true" [showCancel]="false" submitLabel="Enviar" />
    </div>
  </form>
</div>
