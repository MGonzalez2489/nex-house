<div class="space-y-6">
  <!-- Header -->
  <app-page-header
    title="Unidades"
    subTitle="Busca, filtra y administra las unidades de la plataforma."
  />

  <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
    <app-units-table
      class="col-span-2"
      [isLoading]="unitStore.loading()"
      [items]="unitStore.entities()"
      [pagination]="unitStore.pagination()"
      (paginate)="unitStore.loadAll($event)"
      (view)="view($event)"
    />

    <app-units-stats [stats]="unitStore.stats()" />
  </div>
</div>
