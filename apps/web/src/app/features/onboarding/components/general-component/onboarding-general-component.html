<p-panel>
  <h1
    class="font-display text-2xl sm:text-3xl font-semibold text-slate-900 dark:text-white leading-tight"
  >
    Cuéntanos sobre ti
  </h1>
  <p class="text-sm text-slate-500 dark:text-slate-400 mt-2 leading-relaxed">
    Esta información nos ayuda a personalizar tu experiencia dentro de Nimbus.
  </p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
    <!-- Avatar -->
    <div class="flex flex-col items-center">
      <div class="relative">
        <button
          type="button"
          id="avatarButton"
          aria-label="Subir foto de perfil"
          class="h-24 w-24 rounded-full bg-slate-100 dark:bg-slate-800 border-2 border-dashed border-slate-300 dark:border-slate-700 flex items-center justify-center overflow-hidden text-slate-400 hover:border-cyan-400 hover:text-cyan-500 transition"
        >
          <img
            id="avatarPreview"
            src=""
            alt=""
            class="h-full w-full object-cover hidden"
          />
          <i class="pi pi-user text-3xl"></i>
        </button>
        <button
          type="button"
          id="avatarCameraBtn"
          aria-label="Cambiar foto"
          class="absolute -bottom-1 -right-1 h-8 w-8 rounded-full bg-cyan-600 hover:bg-cyan-700 text-white flex items-center justify-center ring-4 ring-white dark:ring-slate-900 transition"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
            />
            <circle cx="12" cy="13" r="4" />
          </svg>
        </button>
        <input type="file" id="avatarInput" accept="image/*" class="hidden" />
      </div>
      <p class="text-xs text-slate-400 mt-2.5">
        JPG o PNG. Opcional, puedes agregarla después.
      </p>
    </div>

    <!-- firstName -->
    <div class="form-control">
      <label class="form-label required" for="firstName">Nombre </label>
      <input
        pInputText
        id="firstName"
        type="text"
        formControlName="firstName"
        placeholder="Ej. Ana"
        fluid
        [invalid]="
          form.controls.firstName.invalid && form.controls.firstName.touched
        "
        [attr.aria-invalid]="
          form.controls.firstName.invalid && form.controls.firstName.touched
        "
        [attr.aria-describedby]="
          form.controls.firstName.touched && form.controls.firstName.errors
            ? 'firstName-error'
            : null
        "
      />

      <app-form-validation-error
        id="firstName-errors"
        [touched]="form.controls.firstName.touched"
        [errors]="form.controls.firstName.errors"
        label="Nombre"
      />
    </div>
    <!-- lastName -->
    <div class="form-control">
      <label class="form-label" for="lastName">Apellidos </label>
      <input
        pInputText
        id="lastName"
        type="text"
        formControlName="lastName"
        placeholder="Ej. Martínez López"
        fluid
        [invalid]="
          form.controls.lastName.invalid && form.controls.lastName.touched
        "
        [attr.aria-invalid]="
          form.controls.lastName.invalid && form.controls.lastName.touched
        "
        [attr.aria-describedby]="
          form.controls.lastName.touched && form.controls.lastName.errors
            ? 'lastName-error'
            : null
        "
      />
    </div>
    <!-- phone -->
    <div class="form-control">
      <label class="form-label required" for="phone">Teléfono </label>
      <input
        pInputText
        id="phone"
        type="text"
        formControlName="phone"
        placeholder="+52 614 123 4567"
        fluid
        [invalid]="form.controls.phone.invalid && form.controls.phone.touched"
        [attr.aria-invalid]="
          form.controls.phone.invalid && form.controls.phone.touched
        "
        [attr.aria-describedby]="
          form.controls.phone.touched && form.controls.phone.errors
            ? 'phone-error'
            : null
        "
      />
      <app-form-validation-error
        id="phone-errors"
        [touched]="form.controls.phone.touched"
        [errors]="form.controls.phone.errors"
        label="Teléfono"
      />
    </div>
    <div class="flex items-center gap-3 pt-2">
      <p-button
        label="Atrás"
        icon="pi pi-arrow-left"
        variant="outlined"
        severity="secondary"
        (click)="prev.emit()"
        [disabled]="isLoading()"
      />
      <p-button
        label="Continuar"
        icon="pi pi-arrow-right"
        iconPos="right"
        fluid
        type="submit"
        class="w-full"
        [loading]="isLoading()"
      />
    </div>
  </form>
</p-panel>
