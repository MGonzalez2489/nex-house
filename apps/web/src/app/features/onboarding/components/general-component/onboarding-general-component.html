<p-panel>
  <ng-template #header>
    <div class="block mb-3">
      <h1
        class="font-display text-2xl sm:text-3xl font-semibold text-slate-900 dark:text-white leading-tight"
      >
        Cuéntanos sobre ti
      </h1>
      <p
        class="text-sm text-slate-500 dark:text-slate-400 mt-2 leading-relaxed"
      >
        Esta información nos ayuda a personalizar tu experiencia dentro de
        Nimbus.
      </p>
    </div>
  </ng-template>

  <app-profile-form-component
    (doSubmit)="doSubmit.emit($event)"
    [profile]="profile()"
  >
    <div class="pt-2">
      <app-form-options
        submitLabel="Continuar"
        cancelLabel="Atrás"
        [callState]="callState()"
        [isLoading]="isLoading()"
        (doCancel)="prev.emit()"
      />
    </div>
  </app-profile-form-component>
</p-panel>
