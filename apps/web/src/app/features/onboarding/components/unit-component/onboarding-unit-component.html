<p-panel showHeader="false" class="pt-5">
  <app-unit-form-component
    [streets]="streets()"
    [unitTypes]="unitTypes()"
    [unitRoles]="unitRoles()"
    [user]="user()"
    (doSubmit)="doSubmit.emit($event)"
  >
    <div class="pt-2">
      <app-form-options
        submitLabel="Continuar"
        cancelLabel="Atrás"
        [callState]="callState()"
        [isLoading]="isLoading()"
        (doCancel)="prev.emit()"
      />
    </div>
  </app-unit-form-component>
</p-panel>
