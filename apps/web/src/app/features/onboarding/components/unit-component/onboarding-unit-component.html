<p-panel>
  <ng-template #header>
    <div class="block mb-3">
      <h1
        class="font-display text-2xl sm:text-3xl font-semibold text-slate-900 dark:text-white leading-tight"
      >
        algo de la unidad
      </h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed">
        algo de la creacion de la unidad
      </p>
    </div>
  </ng-template>

  <app-unit-form-component
    [streets]="streets()"
    [unitTypes]="unitTypes()"
    [unitRoles]="unitRoles()"
    [user]="user()"
    (doSubmit)="doSubmit.emit($event)"
  >
    <div class="flex items-center gap-3 pt-2">
      <p-button
        label="Atrás"
        icon="pi pi-arrow-left"
        variant="outlined"
        severity="secondary"
        [disabled]="isLoading()"
      />
      <p-button
        label="Continuar"
        icon="pi pi-arrow-right"
        iconPos="right"
        fluid
        type="submit"
        class="w-full"
        [loading]="isLoading()"
      />
    </div>
  </app-unit-form-component>
</p-panel>
