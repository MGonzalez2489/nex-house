<app-brand-component />

<div class="flex items-center justify-center">
  <p-stepper [value]="currentStep()" class="basis-130">
    <p-step-list>
      <div class="w-full">
        <div class="flex items-center justify-between mb-2">
          <span
            id="progressLabel"
            class="text-xs font-medium text-slate-500 dark:text-slate-400"
            >Paso {{ currentStep() }} de {{ steps.length - 1 }}</span
          >
          <span
            id="progressStepName"
            class="text-xs font-medium text-cyan-600 dark:text-cyan-400"
            >Bienvenido</span
          >
        </div>
        <div
          class="w-full rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden"
        >
          <p-progressbar class="h-4" [value]="currentProgress()" />
        </div>
      </div>
    </p-step-list>
    <p-step-panels>
      <p-step-panel [value]="0">
        <ng-template #content let-activateCallback="activateCallback">
          <app-onboarding-welcome-component class="block" (next)="move(1)" />
        </ng-template>
      </p-step-panel>
      <p-step-panel [value]="1">
        <ng-template #content let-activateCallback="activateCallback">
          <app-onboarding-pwd-change-component
            [user]="store.user()"
            class="block"
            (prev)="move(-1)"
            (doSubmit)="changePwd($event)"
            (next)="move(1)"
          />
        </ng-template>
      </p-step-panel>
      <p-step-panel [value]="2">
        <ng-template #content let-activateCallback="activateCallback">
          <app-onboarding-general-component
            [user]="store.user()"
            class="block"
            (doSubmit)="updateProfile($event)"
            (prev)="move(-1)"
            (next)="move(1)"
          />
        </ng-template>
      </p-step-panel>
      <p-step-panel [value]="3">
        <ng-template #content let-activateCallback="activateCallback">
          <app-onboarding-finish-component [user]="store.user()" />
        </ng-template>
      </p-step-panel>
    </p-step-panels>
  </p-stepper>
</div>
<p class="text-center text-xs text-slate-400 dark:text-slate-500 mt-6">
  ¿Necesitas ayuda?
  <a href="#" class="text-cyan-600 dark:text-cyan-400 hover:underline"
    >Contáctanos</a
  >
</p>
