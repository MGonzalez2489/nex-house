<div class="max-w-2xl mx-auto pb-24 lg:pb-6">
  <!-- Header -->
  <div class="flex items-center gap-3 mb-6">
    <p-button
      class="hidden"
      (click)="cancel()"
      icon="pi pi-arrow-left"
      severity="secondary"
      variant="outlined"
      size="small"
    />

    <div>
      <h1
        class="text-xl sm:text-2xl font-display font-semibold text-slate-900 dark:text-white"
      >
        Nuevo fraccionamiento
      </h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">
        Registra la información básica y las calles que lo componen.
      </p>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
    <!-- Información general -->
    <p-panel>
      <ng-template #header>
        <h2 class="text-sm font-semibold">Información general</h2>
      </ng-template>

      <!-- Nombre -->
      <div class="form-control">
        <label class="form-label" for="name">Nombre del fraccionamiento</label>
        <input
          pInputText
          id="name"
          type="text"
          formControlName="name"
          placeholder="Ej. Residencial San Agustín"
          fluid
          [invalid]="form.controls.name.invalid && form.controls.name.touched"
          [attr.aria-invalid]="
            form.controls.name.invalid && form.controls.name.touched
          "
          [attr.aria-describedby]="
            form.controls.name.touched && form.controls.name.errors
              ? 'name-error'
              : null
          "
        />
      </div>

    </p-panel>

    <!-- Calles -->
    <p-panel>
      <ng-template #header>
        <div>
          <h2 class="text-sm font-semibold text-slate-800 dark:text-white">
            Calles
          </h2>
          <p class="text-xs text-slate-400 mt-0.5">
            Agrega todas las calles que pertenecen a este fraccionamiento.
          </p>
        </div>
      </ng-template>
      <ng-template #icons>
        <p-badge [value]="streets.length" severity="secondary" />
      </ng-template>

      <div class="space-y-4">
        <div formArrayName="streets" class="space-y-2.5">
          @for (street of streets.controls; track $index) {
            <div class="flex items-start gap-2">
              <div class="flex-1 min-w-0">
                <input
                  pInputText
                  fluid
                  type="text"
                  [formControlName]="$index"
                  placeholder="Ej. Calle Hacienda del Sol"
                />

                <!--   </p> -->
                <!-- } -->
              </div>
              <p-button
                (click)="removeStreet($index)"
                aria-label="Eliminar calle"
                icon="pi pi-trash"
                severity="secondary"
                variant="outlined"
              />
            </div>
          }
        </div>

        <p-button
          (click)="addStreet()"
          icon="pi pi-plus"
          label="Agregar calle"
          fluid
          size="small"
          severity="secondary"
          variant="outlined"
        />
      </div>
    </p-panel>

    <!-- Acciones -->
    <div class="hidden lg:flex items-center justify-end gap-3">
      <p-button
        label="Cancelar"
        (click)="cancel()"
        [disabled]="store.loading()"
        severity="secondary"
        variant="outlined"
      />
      <p-button [loading]="store.loading()" label="Guardar" type="submit" />
    </div>
  </form>

  <!-- Barra de acciones fija en mobile -->
  <div

  >
    <p-button
      label="Cancelar"
      (click)="cancel()"
      [disabled]="store.loading()"
      severity="secondary"
      variant="outlined"
      fluid
      class="flex-1"
    />

    <p-button
      [loading]="store.loading()"
      label="Guardar"
      class="flex-1"
      fluid
    />
  </div>
