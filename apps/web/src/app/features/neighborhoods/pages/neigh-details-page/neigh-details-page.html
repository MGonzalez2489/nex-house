<div class="max-w-2xl mx-auto space-y-4">
  <div class="flex items-start gap-3 mb-6">
    <p-button
      (click)="back()"
      icon="pi pi-arrow-left"
      severity="secondary"
      variant="outlined"
      size="small"
      aria-label="Regresar a fraccionamientos"
    />

    <app-page-header
      class="flex-1"
      title="Detalle del fraccionamiento"
      subTitle="Información registrada en la plataforma."
    >
      <p-button
        label="Editar"
        icon="pi pi-pencil"
        severity="info"
        text
        (click)="edit()"
      />
    </app-page-header>
  </div>

  @if (neighborhood(); as n) {
    <!-- neigh info -->
    <p-panel class="block">
      <ng-template #header>
        <div>
          <p
            class="text-lg font-semibold text-slate-800 dark:text-white capitalize"
          >
            {{ n.name }}
          </p>
          <!-- <p class="text-sm text-slate-400 mt-0.5">munici</p> -->
        </div>
      </ng-template>
      <ng-template #icons>
        <app-neigh-status-tag [isActive]="neighborhood()?.isActive || false" />
      </ng-template>
      <p class="text-xs text-slate-400 mt-4">
        Registrado el {{ n.createdAt | date }}
      </p>
    </p-panel>
    <!-- streets -->
    <p-panel class="block">
      <ng-template #header>
        <h2 class="text-sm font-semibold text-slate-800 dark:text-white mb-3">
          Calles / Secciones ({{ n.streets.length }})
        </h2>
      </ng-template>
      <ul class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        @for (street of n.streets; track street.publicId) {
          <li
            class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-300 bg-slate-50 dark:bg-slate-800 rounded-lg px-3 py-2"
          >
            <i class="pi pi-sun"></i>

            <span class="truncate capitalize">{{ street.name }}</span>
          </li>
        }
      </ul>
    </p-panel>
  } @else {
    <p-panel class="border-dashed">
      <div class="py-10 flex flex-col items-center text-center px-4">
        <p class="text-sm font-medium text-slate-700 dark:text-slate-200">
          Fraccionamiento no encontrado
        </p>
        <button
          (click)="back()"
          class="text-xs text-cyan-600 dark:text-cyan-400 hover:underline mt-2"
        >
          Volver al listado
        </button>
      </div>
    </p-panel>
  }
</div>
