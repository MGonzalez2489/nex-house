<div class="space-y-6">
  <!-- Header -->
  <div
    class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4"
  >
    <div>
      <div class="flex items-center gap-2 flex-wrap">
        <h1
          class="text-xl sm:text-2xl font-display font-semibold text-slate-900 dark:text-white"
        >
          Fraccionamientos
        </h1>
        <span
          class="text-xs font-medium text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 rounded-full px-2 py-0.5"
        >
          {{ entries().length }} registrados · {{ activeEntries() }} activos
        </span>
      </div>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
        Busca, filtra y administra los fraccionamientos de la plataforma.
      </p>
    </div>

    <p-button icon="pi pi-plus" label="Nuevo" (click)="onCreate()" />
  </div>

  <app-neigh-table-filters class="block" (filter)="onSearch($event)" />

  <!-- Lista de resultados -->
  @if (false) {
    <div
      class="rounded-xl border border-dashed border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 py-14 flex flex-col items-center text-center px-4"
    >
      <div
        class="h-12 w-12 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 mb-3"
      >
        <i class="pi pi-sun"></i>
      </div>
      <p class="text-sm font-medium text-slate-700 dark:text-slate-200">
        No se encontraron fraccionamientos
      </p>
      <p class="text-xs text-slate-400 mt-1">
        Intenta con otros filtros o registra uno nuevo.
      </p>
    </div>
  } @else {
    <app-neighborhoods-table
      [items]="neighStore.entities()"
      [pagination]="neighStore.pagination()"
      [isLoading]="neighStore.loading()"
    />
  }
</div>
