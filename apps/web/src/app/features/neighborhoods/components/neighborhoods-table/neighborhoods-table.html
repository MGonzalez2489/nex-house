<app-data-viewer-component
  [data]="items()"
  [columns]="cols"
  [isLoading]="isLoading()"
  [pagination]="pagination()"
  [mode]="isMobile() ? 'list' : 'table'"
>
  <ng-template #body let-neigh let-field="field">
    @switch (field) {
      @case ("name") {
        <div class="text-slate-800 dark:text-white capitalize">
          {{ neigh.name }}
        </div>
      }
      @case ("streets") {
        <p>{{ neigh.streets.length }}</p>
      }
      @case ("isActive") {
        <app-neigh-status-tag [isActive]="neigh.isActive" />
      }
    }
  </ng-template>
  <ng-template #actions let-neigh>
    <p-button
      label="Ver"
      icon="pi pi-search"
      severity="secondary"
      text
      size="small"
      (click)="onView(neigh.publicId)"
    />
  </ng-template>
  <ng-template #list>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 lg:hidden">
      @for (n of items(); track n.publicId) {
        <p-panel>
          <ng-template #header>
            <div class="flex items-center justify-between w-full gap-2">
              <div class="min-w-0">
                <p
                  class="text-sm font-semibold text-slate-800 dark:text-white truncate capitalize"
                >
                  {{ n.name }}
                </p>
                <p class="text-xs text-slate-400 truncate">municipality</p>
              </div>
              <app-neigh-status-tag [isActive]="n.isActive" />
            </div>
          </ng-template>
          <div class="flex items-center justify-between text-xs text-slate-400">
            <span>{{ n.streets.length }} calles</span>
            <span>{{ n.createdAt | date }}</span>
          </div>
          <ng-template #footer>
            <p-button
              label="Ver detalles"
              icon="pi pi-arrow-right"
              iconPos="right"
              severity="secondary"
              variant="outlined"
              size="small"
              fluid
            />
          </ng-template>
        </p-panel>
      }
    </div>
  </ng-template>
</app-data-viewer-component>
