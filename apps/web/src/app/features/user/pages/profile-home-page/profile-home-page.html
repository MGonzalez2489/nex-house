<div class="max-w-2xl mx-auto">
  <!-- header -->
  <app-page-header
    class="mb-6"
    title="Mi perfil"
    subTitle="Consulta y actualiza tu información personal."
  />

  <div class="space-y-4">
    @if (vm(); as data) {
      <app-profile-info-form
        [user]="data.user"
        [profile]="data.profile"
        [isLoading]="store.loading()"
        [callState]="store.callState()"
        class="block"
        (save)="store.update($event)"
      />
      <app-profile-unit
        class="block"
        [userUnits]="store.units()"
        [neighborhood]="neighborhood()"
      />
    } @else if (store.error()) {
      <app-form-feedback [callState]="store.callState()" />
    }
  </div>
</div>
