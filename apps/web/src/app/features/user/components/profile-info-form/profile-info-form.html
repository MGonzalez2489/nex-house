<p-panel header="Información Personal">
  <ng-template #icons>
    @if (mode() !== "form") {
      <p-button
        icon="pi pi-pencil"
        label="Editar"
        text
        severity="secondary"
        size="small"
        (click)="edit()"
      />
    }
  </ng-template>

  <app-profile-form-component
    [profile]="profile()"
    [disabledForm]="mode() === 'info'"
    [resyncKey]="resyncKey()"
    (doSubmit)="doSubmit($event)"
  >
    <div class="form-control">
      <label class="form-label" for="email">Email </label>
      <input
        pInputText
        id="email"
        type="text"
        fluid
        [value]="user().email"
        disabled
      />
    </div>

    @if (mode() === "form") {
      <app-form-options
        [callState]="callState()"
        [isLoading]="isLoading()"
        (doCancel)="cancel()"
      />
    }
  </app-profile-form-component>
</p-panel>
