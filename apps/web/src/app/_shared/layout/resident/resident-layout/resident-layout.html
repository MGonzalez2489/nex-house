<body
  class="h-screen w-screen overflow-hidden bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 antialiased"
>
  <div class="flex h-full w-full flex-col">
    <!-- ============ TOPBAR ============ -->
    @if (showNavComponentes() && sessionService.user()) {
      <app-nav-bar [user]="sessionService.user()!" />
    }

    <!-- ============ CUERPO: sidebar + contenido ============ -->
    <div class="relative flex flex-1 min-h-0">
      <!-- Overlay móvil -->
      <div
        id="overlay"
        class="hidden fixed inset-0 bg-slate-900/50 z-40 lg:hidden"
      ></div>

      <!-- ============ CONTENIDO PRINCIPAL ============ -->
      <main class="flex-1 min-w-0 overflow-y-auto thin-scroll">
        <div class="max-w-350 mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
          <router-outlet />
        </div>
      </main>
    </div>
  </div>
</body>
