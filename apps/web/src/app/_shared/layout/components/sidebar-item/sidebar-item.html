<a
  href="#"
  [routerLink]="item().route"
  class="nav-item active flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-white/5 hover:text-white transition"
  routerLinkActive="active"
  (click)="navigate.emit()"
>
  <i [class]="item().icon"></i>
  {{ item().title }}
</a>
