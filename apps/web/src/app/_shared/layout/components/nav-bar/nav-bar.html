<header
  class="h-16 shrink-0 z-40 flex items-center justify-between gap-3 border-b border-slate-200 dark:border-slate-800 bg-white/90 dark:bg-slate-900/90 backdrop-blur px-3 sm:px-5"
>
  <!-- Izquierda: toggle + brand -->
  <div class="flex items-center gap-2 min-w-0">
    @if (!isResident()) {
      <p-button
        icon="pi pi-bars"
        text
        severity="secondary"
        (click)="toggleSidebar.emit()"
        class="md:hidden"
      />
    }

    <app-brand-component />
  </div>

  <!-- middle -->
  @if (isResident()) {
    <div class="flex items-center gap-3">
      <p-button label="Inicio" icon="pi pi-home" severity="secondary" text />
      <p-button
        label="Mi Fraccionamiento"
        icon="pi pi-building"
        severity="secondary"
        text
      />
      <p-button
        label="Enviar comprobante"
        icon="pi pi-download"
        severity="secondary"
        text
      />
    </div>
  }

  <!-- Derecha: acciones rápidas -->
  <div class="flex items-center gap-1 sm:gap-2 shrink-0">
    <!-- Toggle tema -->
    <p-button
      text
      severity="secondary"
      (click)="toggleTheme()"
      [icon]="darkMode() ? 'pi pi-moon' : 'pi pi-sun'"
    />

    <!-- Notificaciones -->
    <div class="relative">
      <p-button text severity="secondary" icon="pi pi-bell" />

      <div
        id="notifDropdown"
        class="hidden absolute right-0 mt-2 w-72 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-lg shadow-slate-900/10 overflow-hidden z-50"
      >
        <div
          class="px-4 py-3 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between"
        >
          <span class="text-sm font-semibold text-slate-800 dark:text-white"
            >Notificaciones</span
          >
          <span class="text-xs text-cyan-600 dark:text-cyan-400">3 nuevas</span>
        </div>
        <ul class="max-h-64 overflow-y-auto thin-scroll">
          <li
            class="px-4 py-3 flex gap-3 hover:bg-slate-50 dark:hover:bg-slate-800/60 cursor-pointer"
          >
            <span
              class="h-2 w-2 mt-1.5 rounded-full bg-cyan-500 shrink-0"
            ></span>
            <div class="min-w-0">
              <p class="text-sm text-slate-700 dark:text-slate-200 truncate">
                Nueva tarea asignada a ti
              </p>
              <p class="text-xs text-slate-400">hace 5 min</p>
            </div>
          </li>
          <li
            class="px-4 py-3 flex gap-3 hover:bg-slate-50 dark:hover:bg-slate-800/60 cursor-pointer"
          >
            <span
              class="h-2 w-2 mt-1.5 rounded-full bg-cyan-500 shrink-0"
            ></span>
            <div class="min-w-0">
              <p class="text-sm text-slate-700 dark:text-slate-200 truncate">
                Ana comentó en "Proyecto Q3"
              </p>
              <p class="text-xs text-slate-400">hace 1 h</p>
            </div>
          </li>
          <li
            class="px-4 py-3 flex gap-3 hover:bg-slate-50 dark:hover:bg-slate-800/60 cursor-pointer"
          >
            <span
              class="h-2 w-2 mt-1.5 rounded-full bg-slate-300 dark:bg-slate-700 shrink-0"
            ></span>
            <div class="min-w-0">
              <p class="text-sm text-slate-700 dark:text-slate-200 truncate">
                Actualización disponible
              </p>
              <p class="text-xs text-slate-400">ayer</p>
            </div>
          </li>
        </ul>
        <div
          class="px-4 py-2.5 border-t border-slate-100 dark:border-slate-800 text-center"
        >
          <a
            href="#"
            class="text-xs font-medium text-cyan-600 dark:text-cyan-400 hover:underline"
            >Ver todas</a
          >
        </div>
      </div>
    </div>

    <!-- Settings -->
    <p-button text (click)="menu.toggle($event)">
      <app-avatar-component
        [url]="profile().avatar"
        [text]="profile().fullName"
      />

      <span
        class="hidden sm:inline text-sm font-medium text-slate-700 dark:text-slate-200"
        >{{ profile().firstName || "--" }}</span
      >
      <i class="pi pi-chevron-down text-sm text-slate-500"></i>
    </p-button>
    <p-menu #menu [model]="menuItems()" [popup]="true" appendTo="body" />
  </div>
</header>
