<aside
  id="sidebar"
  class="sidebar-open lg:sidebar-open shrink-0 h-full bg-slate-900 flex flex-col overflow-hidden"
>
  <div class="flex flex-col h-full w-72">
    <!-- Navegación (sección superior) -->
    <nav class="flex-1 overflow-y-auto thin-scroll px-4 pt-5 pb-3">
      @for (item of items(); track item.title) {
        @if (item.items && item.items.length > 0) {
          <p
            class="px-3 mb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-500"
          >
            {{ item.title }}
          </p>
          <ul class="space-y-1">
            @for (child of item.items; track child.title) {
              <li>
                <app-sidebar-item [item]="child" />
              </li>
            }
          </ul>
        } @else {
          <app-sidebar-item [item]="item" />
        }
      }
    </nav>

    <!-- Sección inferior: usuario, ayuda, logout -->
    <div class="border-t border-white/10 px-3 py-3 shrink-0">
      <div class="relative">
        <button
          id="userMenuBtn"
          class="w-full flex items-center gap-3 px-2 py-2 rounded-lg hover:bg-white/5 transition"
        >
          <div
            class="h-9 w-9 rounded-full bg-linear-to-br from-fuchsia-400 to-cyan-500 flex items-center justify-center text-white text-xs font-semibold shrink-0"
          >
            AM
          </div>
          <div class="min-w-0 text-left">
            <p class="text-sm font-medium text-white truncate">Ana Martínez</p>
            <p class="text-xs text-slate-400 truncate">Product Manager</p>
          </div>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4 text-slate-500 shrink-0 ml-auto"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="18 15 12 9 6 15" />
          </svg>
        </button>

        <!-- Menú flotante: ayuda + logout -->
        <div
          id="userMenu"
          class="hidden absolute bottom-full left-0 mb-2 w-full rounded-xl border border-white/10 bg-slate-800 shadow-xl overflow-hidden"
        >
          <a
            href="#"
            class="flex items-center gap-2.5 px-3.5 py-2.5 text-sm text-slate-200 hover:bg-white/5 transition"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
              <line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
            Ayuda y soporte
          </a>
          <a
            href="#"
            class="flex items-center gap-2.5 px-3.5 py-2.5 text-sm text-rose-300 hover:bg-rose-500/10 transition border-t border-white/5"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            Cerrar sesión
          </a>
        </div>
      </div>
    </div>
  </div>
</aside>
