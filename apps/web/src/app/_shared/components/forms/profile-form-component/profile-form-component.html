<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
  <!-- Avatar -->
  <p-fileupload
    mode="advanced"
    accept="image/*"
    maxFileSize="1000000"
    formControlName="avatar"
    [customUpload]="true"
    uploadHandler="handleUpload"
  >
    <ng-template
      #header
      let-files
      let-chooseCallback="chooseCallback"
      let-clearCallback="clearCallback"
      let-uploadCallback="uploadCallback"
    >
      <div class="flex flex-wrap justify-between items-center flex-1 gap-4">
        <div class="flex gap-2">
          <p-button
            (onClick)="chooseCallback($event, chooseCallback)"
            icon="pi pi-images"
            [rounded]="true"
            [outlined]="true"
          />
          <p-button
            (onClick)="uploadCallback(uploadCallback)"
            icon="pi pi-cloud-upload"
            [rounded]="true"
            [outlined]="true"
            severity="success"
            [disabled]="!files || files.length === 0"
          />
          <p-button
            (onClick)="clearCallback()"
            icon="pi pi-times"
            [rounded]="true"
            [outlined]="true"
            severity="danger"
            [disabled]="!files || files.length === 0"
          />
        </div>
      </div>
    </ng-template>

    <ng-template #content>
      <button
        type="button"
        id="avatarButton"
        aria-label="Subir foto de perfil"
        class="h-24 w-24 rounded-full bg-slate-100 dark:bg-slate-800 border-2 border-dashed border-slate-300 dark:border-slate-700 flex items-center justify-center overflow-hidden text-slate-400 hover:border-cyan-400 hover:text-cyan-500 transition"
      >
        @if (previewUrl()) {
          <img
            id="avatarPreview"
            [src]="previewUrl()"
            alt="avatar preview"
            class="h-full w-full object-cover"
          />
        } @else {
          <i class="pi pi-user text-3xl"></i>
        }
      </button>
    </ng-template>
    <ng-template #file>es el file</ng-template>
    <ng-template #empty>es el empty</ng-template>
  </p-fileupload>
  <!-- <p-button label="Upload" (onClick)="fu.upload()" severity="secondary" /> -->
  <div class="h-3 bg-red-100 my-3 w-full"></div>

  <div class="flex flex-col items-center">
    <div class="relative">
      <button
        type="button"
        id="avatarButton"
        aria-label="Subir foto de perfil"
        class="h-24 w-24 rounded-full bg-slate-100 dark:bg-slate-800 border-2 border-dashed border-slate-300 dark:border-slate-700 flex items-center justify-center overflow-hidden text-slate-400 hover:border-cyan-400 hover:text-cyan-500 transition"
      >
        @if (previewUrl()) {
          <img
            id="avatarPreview"
            [src]="previewUrl()"
            alt="avatar preview"
            class="h-full w-full object-cover"
          />
        } @else {
          <i class="pi pi-user text-3xl"></i>
        }
      </button>
      <button
        type="button"
        id="avatarCameraBtn"
        aria-label="Cambiar foto"
        class="absolute -bottom-1 -right-1 h-8 w-8 rounded-full bg-cyan-600 hover:bg-cyan-700 text-white flex items-center justify-center ring-4 ring-white dark:ring-slate-900 transition"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
          />
          <circle cx="12" cy="13" r="4" />
        </svg>
      </button>
      <input type="file" id="avatarInput" accept="image/*" class="hidden" />
    </div>
    <p class="text-xs text-slate-400 mt-2.5">
      JPG o PNG. Opcional, puedes agregarla después.
    </p>
  </div>

  <!-- firstName -->
  <div class="form-control">
    <label class="form-label required" for="firstName">Nombre </label>
    <input
      pInputText
      id="firstName"
      type="text"
      formControlName="firstName"
      placeholder="Ej. Ana"
      fluid
      [invalid]="
        form.controls.firstName.invalid && form.controls.firstName.touched
      "
      [attr.aria-invalid]="
        form.controls.firstName.invalid && form.controls.firstName.touched
      "
      [attr.aria-describedby]="
        form.controls.firstName.touched && form.controls.firstName.errors
          ? 'firstName-error'
          : null
      "
    />

    <app-form-validation-error
      id="firstName-errors"
      [touched]="form.controls.firstName.touched"
      [errors]="form.controls.firstName.errors"
      label="Nombre"
    />
  </div>
  <!-- lastName -->
  <div class="form-control">
    <label class="form-label" for="lastName">Apellidos </label>
    <input
      pInputText
      id="lastName"
      type="text"
      formControlName="lastName"
      placeholder="Ej. Martínez López"
      fluid
      [invalid]="
        form.controls.lastName.invalid && form.controls.lastName.touched
      "
      [attr.aria-invalid]="
        form.controls.lastName.invalid && form.controls.lastName.touched
      "
      [attr.aria-describedby]="
        form.controls.lastName.touched && form.controls.lastName.errors
          ? 'lastName-error'
          : null
      "
    />
  </div>
  <!-- phone -->
  <div class="form-control">
    <label class="form-label required" for="phone">Teléfono </label>
    <input
      pInputText
      id="phone"
      type="text"
      formControlName="phone"
      placeholder="+52 614 123 4567"
      fluid
      [invalid]="form.controls.phone.invalid && form.controls.phone.touched"
      [attr.aria-invalid]="
        form.controls.phone.invalid && form.controls.phone.touched
      "
      [attr.aria-describedby]="
        form.controls.phone.touched && form.controls.phone.errors
          ? 'phone-error'
          : null
      "
      pInputMask="(999)-999-9999"
      placeholder="(614)-123-4567"
    />
    <app-form-validation-error
      id="phone-errors"
      [touched]="form.controls.phone.touched"
      [errors]="form.controls.phone.errors"
      label="Teléfono"
    />
  </div>
  <p-button label="submit" type="submit" />
</form>
