<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
  <div class="flex flex-col items-center">
    <div class="flex items-center">
      <!-- Avatar -->
      <p-fileupload
        mode="advanced"
        accept="image/*"
        maxFileSize="1000000"
        formControlName="avatar"
        [customUpload]="true"
        uploadHandler="handleUpload"
        [pt]="{
          header: 'h-0',
          root: 'bg-transparent w-30 border-none',
          content: 'p-0',
        }"
      >
        <ng-template
          #header
          let-files
          let-chooseCallback="chooseCallback"
          let-clearCallback="clearCallback"
          let-uploadCallback="uploadCallback"
        >
          <div
            class="flex flex-wrap justify-between items-center flex-1 gap-4 relative top-30 left-18"
          >
            <p-button
              (onClick)="chooseCallback($event, chooseCallback)"
              [disabled]="disabledForm()"
              icon="pi pi-images"
              [rounded]="true"
              class="rounded-full bg-cyan-600 hover:bg-cyan-700 text-white flex items-center justify-center ring-4 ring-white dark:ring-slate-900 transition"
            />
          </div>
        </ng-template>

        <ng-template #content>
          <button
            type="button"
            id="avatarButton"
            aria-label="Subir foto de perfil"
            class="h-30 w-30 rounded-full bg-slate-100 dark:bg-slate-800 border-2 border-dashed border-slate-300 dark:border-slate-700 flex items-center justify-center overflow-hidden text-slate-400 hover:border-cyan-400 hover:text-cyan-500 transition"
          >
            @if (previewUrl()) {
              <img
                id="avatarPreview"
                [src]="previewUrl()"
                alt="avatar preview"
                class="h-full w-full object-cover"
              />
            } @else {
              <i class="pi pi-user text-3xl"></i>
            }
          </button>
        </ng-template>
        <ng-template #file>es el file</ng-template>
      </p-fileupload>
    </div>

    <p class="text-xs text-slate-400 mt-2.5">
      JPG o PNG. Opcional, puedes agregarla después.
    </p>
  </div>

  <!-- firstName -->
  <div class="form-control">
    <label class="form-label required" for="firstName">Nombre </label>
    <input
      pInputText
      id="firstName"
      type="text"
      formControlName="firstName"
      placeholder="Ej. Ana"
      fluid
      [invalid]="
        form.controls.firstName.invalid && form.controls.firstName.touched
      "
      [attr.aria-invalid]="
        form.controls.firstName.invalid && form.controls.firstName.touched
      "
      [attr.aria-describedby]="
        form.controls.firstName.touched && form.controls.firstName.errors
          ? 'firstName-error'
          : null
      "
    />

    <app-form-validation-error
      id="firstName-errors"
      [touched]="form.controls.firstName.touched"
      [errors]="form.controls.firstName.errors"
      label="Nombre"
    />
  </div>
  <!-- lastName -->
  <div class="form-control">
    <label class="form-label" for="lastName">Apellidos </label>
    <input
      pInputText
      id="lastName"
      type="text"
      formControlName="lastName"
      placeholder="Ej. Martínez López"
      fluid
      [invalid]="
        form.controls.lastName.invalid && form.controls.lastName.touched
      "
      [attr.aria-invalid]="
        form.controls.lastName.invalid && form.controls.lastName.touched
      "
      [attr.aria-describedby]="
        form.controls.lastName.touched && form.controls.lastName.errors
          ? 'lastName-error'
          : null
      "
    />
  </div>
  <!-- phone -->
  <div class="form-control">
    <label class="form-label required" for="phone">Teléfono </label>
    <input
      pInputText
      id="phone"
      type="text"
      formControlName="phone"
      placeholder="+52 614 123 4567"
      fluid
      [invalid]="form.controls.phone.invalid && form.controls.phone.touched"
      [attr.aria-invalid]="
        form.controls.phone.invalid && form.controls.phone.touched
      "
      [attr.aria-describedby]="
        form.controls.phone.touched && form.controls.phone.errors
          ? 'phone-error'
          : null
      "
      pInputMask="(999)-999-9999"
      placeholder="(614)-123-4567"
    />
    <app-form-validation-error
      id="phone-errors"
      [touched]="form.controls.phone.touched"
      [errors]="form.controls.phone.errors"
      label="Teléfono"
    />
  </div>

  <!-- to add submit options or other fields -->
  <ng-content></ng-content>
</form>
